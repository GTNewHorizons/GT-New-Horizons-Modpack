# Configuration file

flatworld {
    # If you set world generator to flat, specify the flat template here. (Format: Qty BlockName Meta
    S:"Flat World Config" <
        2;
        1 minecraft:bedrock
        52 minecraft:sandstone
        1 minecraft:dirt 2
        ;2;
        biome_1
        village
     >
}


general {
    # Enabling this will display all world generators installed, useful for debug [default: false]
    B:"Show World Generators in Log"=false

    # The world generator to select by default [default: default]
    S:"World Generator"=RWG2_CONTINENTS

    # Allowed world generators. Leave empty to allow all. Hold Alt while clicking to cycle through all generators.
    S:"World Generator Whitelist" <
        flat
        RWG
        RWG2_CONTINENTS
     >
}


