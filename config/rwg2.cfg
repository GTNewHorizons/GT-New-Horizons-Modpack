"continental rwg" {
    # Distance in blocks from a continent's Voronoi centre to its coast. Changing this after creating a world causes borders between old and new chunks. [range: 1.0 ~ 100000.0, default: 2700.0]
    S:"Minimum Continent Width"=2700.0

    # Distance in blocks from a continent's Voronoi centre to its coast. Changing this after creating a world causes borders between old and new chunks. [range: 1.0 ~ 100000.0, default: 2700.0]
    S:"Maximum Continent Width"=2700.0

    # Average ocean band width in blocks; continent plus ocean width sets the Voronoi radius. Changing this after creating a world causes borders between old and new chunks. [range: 1.0 ~ 100000.0, default: 100.0]
    S:"Average Ocean Width"=100.0

    # Minimum total water gap in blocks between two maximum-sized continents. Changing this after creating a world causes borders between old and new chunks. [range: 0.0 ~ 100000.0, default: 50.0]
    S:"Minimum Ocean Width"=50.0

    # Approximate upper limit on the fraction of the world covered by ocean. 1.0 disables the limit. Lower values dilate continents after placement, so oceans that normally separate continents may become interior seas. The result is approximate and varies with the world seed and the other continent settings. Changing this after creating a world causes borders between old and new chunks. [range: 0.0 ~ 1.0, default: 0.4]
    S:"Maximum Ocean Fraction"=0.4

    # Distance in blocks from an island seed to its coast. Changing this after creating a world causes borders between old and new chunks. [range: 1.0 ~ 100000.0, default: 300.0]
    S:"Minimum Island Width"=300.0

    # Distance in blocks from an island seed to its coast. Changing this after creating a world causes borders between old and new chunks. [range: 1.0 ~ 100000.0, default: 600.0]
    S:"Maximum Island Width"=600.0

    # Chance to retain an island after valid island seeds have been identified. Changing this after creating a world causes borders between old and new chunks. [range: 0.0 ~ 1.0, default: 0.3]
    S:"Island Placement Chance"=0.3

    # Chance for a large island to contain a volcano. Changing this after creating a world causes borders between old and new chunks. [range: 0.0 ~ 1.0, default: 0.15]
    S:"Large Island Volcano Chance"=0.15

    # Approximate average number of each enabled landmark type per continent. Candidate probability is corrected for the configured continental land fraction. Changing this after creating a world causes borders between old and new chunks. [range: 0.0 ~ 100.0, default: 0.25]
    S:"Average Landmarks Per Type And Continent"=0.25

    # Scales biome extent by this factor, conceptually similar to vanilla Large Biomes. Changing this after creating a world causes borders between old and new chunks. [range: 0.25 ~ 10.0, default: 1.0]
    S:"Biome Size Multiplier"=1.0
}


debug {
    # Logs cross-chunk tree and village generation. Adds hooks to World.setBlock. Requires a restart. [default: false]
    B:"Enable Worldgen Diagnostics"=false
}


##########################################################################################################
# expert / worldgen migration
#--------------------------------------------------------------------------------------------------------#
# EXPERT ONLY! With the same seed, coordinates, and biome, RWG produces the same terrain shape. New world-generation versions can move continents and biomes, so these offsets let you place an existing base inside the appropriate biome and on land again. After aligning the new map with runPreview, Server Utilities can restore claimed chunks from backup into the surrounding terrain more seamlessly. Finalize these values before generating new chunks.
##########################################################################################################

"expert / worldgen migration" {
    # Offsets climate and biome selection without moving the selected biome's terrain noise. Expert migration setting. Change only before generating new chunks. Positive values sample the generator at larger coordinates, moving the corresponding map features toward negative coordinates. [range: -30000000 ~ 30000000, default: 0]
    I:"Biome Placement Offset X"=0

    # Offsets climate and biome selection without moving the selected biome's terrain noise. Expert migration setting. Change only before generating new chunks. Positive values sample the generator at larger coordinates, moving the corresponding map features toward negative coordinates. [range: -30000000 ~ 30000000, default: 0]
    I:"Biome Placement Offset Z"=0

    # Offsets continent and island placement without moving biome terrain noise. Expert migration setting. Change only before generating new chunks. Positive values sample the generator at larger coordinates, moving the corresponding map features toward negative coordinates. [range: -30000000 ~ 30000000, default: 0]
    I:"Landmass Placement Offset X"=0

    # Offsets continent and island placement without moving biome terrain noise. Expert migration setting. Change only before generating new chunks. Positive values sample the generator at larger coordinates, moving the corresponding map features toward negative coordinates. [range: -30000000 ~ 30000000, default: 0]
    I:"Landmass Placement Offset Z"=0
}


##########################################################################################################
# landmark decorations
#--------------------------------------------------------------------------------------------------------#
# Centerpieces placed on top of RWG's landmark pillars. These only apply to chunks generated after the change.
##########################################################################################################

"landmark decorations" {
    # Chance for an eligible river junction landmark to carry a ready-made Twilight Forest portal instead of a LootGames puzzle. 0 disables these portals entirely. Requires Twilight Forest. [range: 0.0 ~ 1.0, default: 0.25]
    S:"Twilight Forest Portal Chance"=0.25

    # Twilight Forest portals are not placed within this many blocks of x=0, z=0. Junctions inside the radius fall back to a LootGames puzzle. [range: 0 ~ 30000000, default: 3500]
    I:"Twilight Forest Portal Minimum Spawn Distance"=3500

    # Chance for one of those portals to generate as a plain water pool that a player still has to light with Twilight Forest's activation item. 1 leaves every pool unlit. [range: 0.0 ~ 1.0, default: 0.5]
    S:"Twilight Forest Portal Unlit Chance"=0.5
}


