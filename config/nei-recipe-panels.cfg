# Configuration file

client {
    # Only show the NEI imprint button when you are allowed to imprint (a Recipe Blueprint in your inventory, or creative mode). [default: true]
    B:buttonRequiresBlueprint=true

    # Panel image resolution multiplier. Lower values fit more panels in the same budget. [range: 1 ~ 4, default: 2]
    I:supersample=2

    # Video memory budget for cached panel images. Panels beyond it show a capacity notice. [range: 32 ~ 4096, default: 128]
    I:textureBudgetMB=128
}


recipe {
    # Register the built-in crafting recipe for the Recipe Blueprint. Disable to define your own via a tweaker. [default: true]
    B:registerBlueprintRecipe=true
}


server {
    # Also spend a Recipe Blueprint when a creative-mode player imprints. [default: false]
    B:consumeInCreative=false

    # Reject an imprint whose recipe has more ingredient / byproduct slots than this. [range: 1 ~ 256, default: 256]
    I:maxIngredients=256

    # Maximum uncompressed bytes in an imprinted recipe document, before it is queued or saved. [range: 512 ~ 262144, default: 16384]
    I:maxSnapshotBytes=16384

    # Who may imprint recipe panels. Synced to clients so the NEI button reflects it.
    # Possible values: [DISABLED, CREATIVE_ONLY, OP_ONLY, EVERYONE]
    #  [default: EVERYONE]
    S:panelMode=EVERYONE
}


