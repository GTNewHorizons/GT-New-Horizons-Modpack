# Configuration file

chisel {
    # How many blocks a single chisel placement may reach into. Every block becomes a tile entity of its own, so big placements can overload the server. Bigger placements are refused with a message. Should be the same on the client and on the server, the client checks it before placing as well. [range: 1 ~ 2147483647, default: 100]
    I:maxBlocks=100
}


little_bag {
    # How many different materials a single little bag can hold. Every material needs a slot of its own for the tiles that do not add up to a whole block, so this is what keeps the size of the bag in check. Has to be the same on the client and on the server. Lowering it keeps what bags hold already, a bag above the limit only refuses new materials until enough were taken out. [range: 1 ~ 10000, default: 200]
    I:maxMaterials=200
}


recipe {
    # How many blocks the area of a recipe may cover. Every block in it is looked at when the recipe is saved, which loads its chunk, so big areas can overload the server. Bigger areas are refused with a message. [range: 1 ~ 2147483647, default: 1000]
    I:maxBlocks=1000

    # How many tiles a recipe may save. Every tile is stored in the item, and big items are sent to the clients again and again. Selections with more tiles are refused with a message. Recipes saved before keep their tiles, but can't be placed while they have more tiles than this. [range: 1 ~ 2147483647, default: 1024]
    I:maxTiles=1024
}


