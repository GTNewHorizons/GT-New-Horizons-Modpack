general {
    # The maximum relative strength of the blocks in the aoe of the tool compared to the broken block to still mine them
    I:"AOE Harvest Max Relative Strength"=10

    # Grants effects to players when consuming XP berries
    B:"Allow effects for consumption"=false

    # Allow stacks of essence berries to be consumed at once when shifting (this does not spawn XP orbs in world).
    B:"Allow stackwise consumption"=true

    # You will always get a TConstruct item from casting an ingot or block.
    B:"Always cast TConstruct ingots"=false

    #  If an effect fails to apply, check the console for information 
    #  FORMAT: 
    #  potionID (Can also put "DAMAGE" to hurt the player instead, 
    #  effectDuration (in ticks) (or DAMAGE effect strength) , 
    #  initialAmplifier (Exclude if the first parameter is DAMAGE), 
    #  maxDuration (this is the maximum duration the potions can stack in ticks (Exclude if the first parameter is DAMAGE)), 
    #  maxAmplifier (the maximum allowed potionAmplifier with multiple effects uses (Exclude if the first parameter is DAMAGE)), 
    #  stackExclusiveEffect (a true or false value which allows the effect to be only applied when the essence berries are eaten while shift is held (Only works if Allow stackwise consumption = true)
    S:"Applied effects" <
        9, 200, 1, 1200, 2, false
        17, 160, 1, 1000, 3, false
        DAMAGE, 0.5, false 
        9, 400, 2, 1200, 2, true
        17, 320, 1, 1000, 3, true
        DAMAGE, 0.3, true
     >

    # Disable all TiC recipes (smeltery, drying rack, crafting, etc)
    B:"Disable All Recipes"=false
    I:"Sea level"=64

    # Shift-click items from the player or attached inventory into the crafting station grid first. When false, move items between the player and attached inventory, or into the grid if no inventory is attached. Tinkers' tools always prefer the center slot
    B:craftingStationShiftClickToGrid=false
}


