dimblacklist {
    # Disallow Traveller's Belt ability to swap inventories for certain dimension ID's
    I:ForbiddenDim <
        55
     >

    # True: slime islands wont generate in any ages other than overworld(if enabled); False: will generate in all non-blackisted ages
    B:GenerateSlimeIslandInDim0Only=true

    # Dimension IDs where ore berry bushes are allowed to generate (only used when OreBushUseWhitelist=true)
    I:OreBushDimWhitelist <
        0
     >

    # True: ore berry bushes only generate in dimensions listed in OreBushDimWhitelist; False: use isSurfaceWorld() check
    B:OreBushUseWhitelist=true

    # Add dimension ID's to prevent slime islands from generating in them
    I:SlimeIslandDimBlacklist <
     >

    # Dimension IDs where slime islands are allowed to generate (only used when SlimeIslandUseWhitelist=true)
    I:SlimeIslandDimWhitelist <
        0
     >

    # True: slime islands only generate in dimensions listed in SlimeIslandDimWhitelist; False: use blacklist behavior
    B:SlimeIslandUseWhitelist=true

    # Generate slime islands in flat worlds
    B:genIslandsFlat=false

    # Generate ores in flat worlds
    B:genOresFlat=false

    # True: slime islands generate in overworld; False they do not generate
    B:slimeIslGenDim0=true
}


