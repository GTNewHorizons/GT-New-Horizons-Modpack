# Configuration file

afk {
    # Enables afk timer. [default: true]
    B:enabled=true

    # Enables afk timer in singleplayer. [default: true]
    B:enabled_singleplayer=true

    # After how much time it will display notification to all players. [default: 5m]
    S:notification_timer=5m
}


auto_shutdown {
    # Enables auto-shutdown. [default: false]
    B:enabled=false

    # Enables auto-shutdown in singleplayer worlds. [default: false]
    B:enabled_singleplayer=false

    # Server will automatically shut down after X hours.
    # Time Format: HH:MM. If the system time matches a value, server will shut down.
    # It will look for closest value available that is not equal to current time. [default: [04:00], [16:00]]
    S:times <
        04:00
        16:00
     >
}


backups {
    # List of additional paths to include in backup. Use / as directory separator! Use * as wildcard, and $WORLDNAME for the save name. If specifying a folder, the path should end with "/**" to match all subfolders and files. In async mode these paths are read while the server is running, so external writers may change them during backup. [default: [saves/NEI/global/**], [saves/NEI/local/$WORLDNAME/**]]
    S:additional_backup_files <
        journeymap/data/sp/$WORLDNAME/**
        TCNodeTracker/$WORLDNAME/**
        saves/NEI/global/**
        saves/NEI/local/$WORLDNAME/**
        visualprospecting/client/*/$WORLDNAME_*/**
        visualprospecting/server/$WORLDNAME_*/**
     >

    # Backup entire regions that contain at least one claimed chunk.
    # This backs up complete .mca files instead of reconstructing temporary files with only claimed chunks.
    # Requires only_backup_claimed_chunks to be enabled. [default: false]
    B:backup_entire_regions_with_claims=false

    # Path to backups folder. [default: ./backups/]
    S:backup_folder_path=./backups/

    # Time between backups. Examples: 30m, 1h, 6h, 1d.
    # Units: s=seconds, m=minutes, h=hours, d=24 hours, w=7 days. Positive integers only; minimum 1s.
    # Values without units are legacy hours, converted and saved with units on startup.
    # Legacy hours round up to whole seconds; zero becomes 1s.
    # Invalid values prevent automatic backups until corrected; manual backups remain available. [default: 30m]
    S:backup_timer=30m

    # Number of backup files to keep before deleting old ones. Always preserves the latest eligible backup per world. Ignored when retention_policy is nonempty. [range: 1 ~ 2147483647, default: 12]
    I:backups_to_keep=12

    # How much the backup file will be compressed. 0 - uncompressed, 1 - best speed, 9 - smallest file size. [range: 0 ~ 9, default: 1]
    I:compression_level=1

    # Delete backups that have a custom name set through /backup start <name> [default: true]
    B:delete_custom_name_backups=true

    # Prints (current size | total size) when backup is done [default: true]
    B:display_file_size=true

    # Enables backups. [default: true]
    B:enable_backups=true

    # List of non-region paths to exclude when creating backups - those have priority over additional paths! Region files (.mca) are not excluded. Exclusions do not affect restoring backups. Use / as directory separator! Use * as wildcard, and $WORLDNAME for the save name. If specifying a folder, the path should end with "/**" to match all subfolders and files. [default: ]
    S:excluded_backup_files <
     >

    # Size allowance for rotating backup archives in GB. Deletes eligible old backups when exceeded.
    # 0 = Disabled and backups_to_keep will be used instead, unless retention_policy is set.
    # With legacy retention, counts only eligible ZIP files and preserves the newest eligible backup per world.
    # Protected custom backups are excluded from the size allowance in both modes.
    # Unrecognized/unreadable and future-dated archives are also preserved and excluded.
    # With retention_policy, removes the oldest finite-retention backups after age pruning.
    # Forever representatives are also excluded from the allowance; total folder size can exceed it.
    # The latest backup per world is never removed to meet this allowance, but counts unless otherwise excluded.
    # Logs a warning if counted protected backups or failed deletions prevent meeting the allowance. [range: 0 ~ 2147483647, default: 0]
    I:max_folder_size=0

    # Skip automatic backups while no players are online and no player activity is pending.
    # Login/logout activity permits a final backup after everyone leaves; failed attempts remain pending.
    # Retention uses elapsed time, so empty-server periods can leave gaps in policy history.
    # Set false for backups while empty, especially if automation keeps changing the world. [default: true]
    B:need_online_players=true

    # Only include claimed chunks in backup.
    # Backups will be much faster and smaller, but any unclaimed chunk will be unrecoverable. [default: false]
    B:only_backup_claimed_chunks=false

    # Reduces lag when a backup starts. Only applies when use_separate_thread is enabled.
    # Files are copied while the server is running, so backups may contain inconsistent or partially written mod and player data and may not restore correctly. World chunks are not affected by this option. [default: false]
    B:prefer_speed_over_backup_consistency=false

    # Optional age-window retention rules, one maximum-age:sampling-interval per line.
    # Example: 1h:all, 1d:30m, 7d:1h, 30d:1d, forever:1w.
    # Units: s=seconds, m=minutes, h=hours, d=24 hours, w=7 days. All durations must be positive integers.
    # Keeps the newest backup per populated UTC bucket; weeks start Monday. Rules combine regardless of order.
    # 'all' keeps every backup in the window; 'forever' has no age limit.
    # The current bucket's representative may be replaced. Completed forever buckets remain under an unchanged policy.
    # Always keeps the latest backup per world. Missing/offline periods are not filled.
    # Protected custom backups are kept separately and do not fill time buckets or replace the latest backup.
    # Empty = existing count/size retention. Invalid rules disable pruning until corrected.
    # This only controls retention; backup_timer still controls how frequently backups are created.
    # Use /backup prune preview to inspect the decisions without deleting anything. [default: ]
    S:retention_policy <
     >

    # Silence every backup notification except for critical errors. [default: false]
    B:silent_backup=false

    # Run backup in a separated thread (recommended) [default: true]
    B:use_separate_thread=true
}


