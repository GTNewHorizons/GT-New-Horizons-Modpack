name: build-and-quest

on:
  pull_request:
    paths:
      - config/betterquesting/DefaultQuests/**
      - .github/scripts/pack-default-quests.py
      - .github/workflows/build-and-quest.yml
      - .github/workflows/release-tags.yml

permissions:
  contents: read

jobs:
  build-and-quest:
    name: Build DefaultQuests artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5

      - name: Validate packed default quest definitions
        run: |
          python .github/scripts/pack-default-quests.py \
            config/betterquesting/DefaultQuests "$RUNNER_TEMP/DefaultQuests.json.gz"

      - name: Stage DefaultQuests
        run: |
          mkdir -p artifact
          cp -a config/betterquesting/DefaultQuests artifact/DefaultQuests

      - name: Upload DefaultQuests
        uses: actions/upload-artifact@v7
        with:
          name: DefaultQuests-PR-${{ github.event.pull_request.number }}
          path: artifact
          if-no-files-found: error
