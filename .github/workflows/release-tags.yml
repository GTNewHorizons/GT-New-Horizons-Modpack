# This workflow will build and release a zip of the modpack config and script files.

name: Release tagged version

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.8.0
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Bundle matching GTNH-Guide-Pack release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIDE_REPO: GTNewHorizons/GTNH-Guide-Pack
        run: |
          set -euo pipefail
          LATEST_GUIDE=$(gh release view --repo "$GUIDE_REPO" --json tagName,publishedAt \
            --jq '[.tagName, .publishedAt] | @tsv')
          IFS=$'\t' read -r GUIDE_TAG GUIDE_PUBLISHED_AT <<< "$LATEST_GUIDE"

          if [[ "${RELEASE_VERSION}" == *-pre ]]; then
            PRE_GUIDE=$(gh release list --repo "$GUIDE_REPO" --limit 100 \
              --json tagName,publishedAt,isDraft,isPrerelease \
              --jq '[.[] | select((.isDraft | not) and .publishedAt != null)
                          | select(.tagName != "guide-page-lang-dev-build")
                          | select(.isPrerelease or (.tagName | endswith("-pre")))]
                    | max_by(.publishedAt) | select(. != null)
                    | [.tagName, .publishedAt] | @tsv')
            IFS=$'\t' read -r PRE_GUIDE_TAG PRE_GUIDE_PUBLISHED_AT <<< "$PRE_GUIDE"
            if [[ -n "$PRE_GUIDE_TAG" && "$PRE_GUIDE_PUBLISHED_AT" > "$GUIDE_PUBLISHED_AT" ]]; then
              GUIDE_TAG=$PRE_GUIDE_TAG
            fi
          elif [[ "$GUIDE_TAG" == *-pre ]]; then
            GUIDE_TAG=$(gh release list --repo "$GUIDE_REPO" --limit 100 \
              --exclude-drafts --exclude-pre-releases --json tagName,publishedAt \
              --jq '[.[] | select(.publishedAt != null and .tagName != "guide-page-lang-dev-build")
                          | select(.tagName | endswith("-pre") | not)]
                    | max_by(.publishedAt).tagName // empty')
          fi
          if [[ -z "$GUIDE_TAG" || "$GUIDE_TAG" == guide-page-lang-dev-build ]]; then
            echo "No matching GTNH-Guide-Pack release found" >&2
            exit 1
          fi
          echo "Selected GTNH-Guide-Pack release: $GUIDE_TAG"
          mkdir -p config/guidenh
          rm -f config/guidenh/DefaultGuide.zip
          gh release download "$GUIDE_TAG" --repo "$GUIDE_REPO" \
            --pattern '*.zip' \
            --dir config/guidenh
          GUIDE_ZIP=$(find config/guidenh -maxdepth 1 -type f -name '*.zip' ! -name 'DefaultGuide.zip' | head -n 1)
          if [[ -z "$GUIDE_ZIP" ]]; then
            echo "Downloaded GTNH-Guide-Pack zip asset was not found" >&2
            exit 1
          fi
          mv "$GUIDE_ZIP" config/guidenh/DefaultGuide.zip

      - name: Stamp questbook version
        env:
          QB_VERSION_BASE: 2110
          QB_VERSION_BASE_REF: f94b1919aa1dd24c113db27e9ba36d20ce92746a
        run: |
          python .github/scripts/stamp-qb-version.py \
            --base-version "$QB_VERSION_BASE" \
            --base-ref "$QB_VERSION_BASE_REF"

      - name: Prepare release folder
        run: |
          mkdir -p release
      
      - name: Create release zip
        run: |
          zip -r release/${{ env.RELEASE_VERSION }}.zip . \
              -x changelog.py \
              -x ".git/*" \
              -x ".github/*" \
              -x "release/*" \
              -x "raw/*"

      - name: Release under current tag
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ env.RELEASE_VERSION }}"
          prerelease: false
          title: "${{ env.RELEASE_VERSION }}"
          files: release/*
